# Render deployment configuration file
# Place this in the root directory of your repository

services:
  - type: web
    name: interview-quiz-backend
    runtime: python
    pythonVersion: 3.11
    plan: free
    
    # Build command
    buildCommand: >
      pip install -r backend/requirements.txt &&
      cd backend &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    
    # Start command
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    
    # Environment variables
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        fromFile: /etc/secrets/django_secret_key
      - key: ALLOWED_HOSTS
        value: "interview-quiz-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://interview-quiz-xxxxx.vercel.app"
    
    # Scaling
    numInstances: 1
    healthCheckPath: /api/
    
    # Cron job to keep service warm (optional, premium only)
    # cronJobs:
    #   - name: keep-alive
    #     schedule: "*/14 * * * *"
    #     command: curl https://interview-quiz-backend.onrender.com/api/
